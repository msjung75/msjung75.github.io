<html lang="ko">
<head>

<title>SEWANG SANGSA · 세왕상사</title>
<style>
:root{--navy:#1B2A4A;--navy2:#24334F;--gold:#B8924A;--golds:#DEBE7E;--sky:#9DB0D0;--line:#E8EBF0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Hiragino Sans','PingFang SC',sans-serif;color:#1A1D24;background:#fff}
.wrap{max-width:560px;margin:0 auto}
.hero{background:var(--navy);color:#fff;padding:44px 24px 36px;text-align:center}
.hero .tag{color:var(--golds);font-size:13px;letter-spacing:1px;margin-top:10px}
.hero h1{font-size:26px;margin-top:6px}
.hero .head{color:var(--sky);font-size:15px;margin-top:10px;line-height:1.5}
.langs{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.langs button{border:1px solid #4A5C84;background:transparent;color:var(--sky);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.langs button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
.stats{display:flex;background:#F7F5F0;border-bottom:1px solid var(--line)}
.stats div{flex:1;text-align:center;padding:18px 6px}
.stats b{display:block;font-size:22px;color:var(--navy)}
.stats span{font-size:11px;color:#5B636E;line-height:1.4;display:block;margin-top:4px}
section{padding:30px 24px 6px}
h2{color:var(--navy);font-size:20px;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block;margin-bottom:16px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;margin:8px 0 4px}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .v{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.chart .b{width:70%;background:var(--navy2);border-radius:4px 4px 0 0}
.chart .bar:last-child .b{background:var(--gold)}
.chart .y{font-size:11px;color:#5B636E;margin-top:6px}
.quote{background:#F7F5F0;border-left:3px solid var(--gold);padding:18px;border-radius:0 12px 12px 0;color:var(--navy);font-size:15px;line-height:1.8}
.ceo{font-weight:700;margin-top:14px;font-size:15px}
.card{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.card b{color:var(--golds);display:block;margin-bottom:6px;font-size:15px}
.card p{color:#DEE6F2;font-size:13.5px;line-height:1.6}
img.ph{width:100%;border-radius:14px;display:block}
.cap{font-size:12px;color:#5B636E;margin:6px 0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--navy);font-weight:700;width:88px;white-space:nowrap}
.appbox{background:var(--navy);color:#fff;border-radius:16px;padding:26px 20px;text-align:center;margin:6px 0 8px}
.appbox p{color:var(--sky);font-size:13.5px;margin:8px 0 16px}
.btn{display:inline-block;background:#fff;color:var(--navy);font-weight:700;border-radius:12px;padding:14px 26px;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid #4A5C84;margin-top:10px;display:block}
footer{background:var(--navy);color:var(--sky);text-align:center;padding:28px 20px;font-size:12px;line-height:1.8;margin-top:30px}
footer .g{color:var(--golds);letter-spacing:2px}
a{color:inherit}
</style>
</head>
